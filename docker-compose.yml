services:
  postgres:
    image: postgres:16-alpine
    container_name: fresh_retail_dw_postgres
    environment:
      POSTGRES_DB: fresh_retail_dw
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
    ports:
      - "5433:5432"
    volumes:
      - fresh_retail_postgres_data:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d fresh_retail_dw"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  fresh_retail_postgres_data:
